<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Firefox for Android opens this page as an ordinary tab, and without
         this it is laid out at desktop width and then shrunk to fit, which
         leaves every label too small to read and every checkbox too small to
         hit. On desktop the line does nothing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- One page for every extension: options.js names the site, from core.js. -->
    <title>PeaceBeStill</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <h1>PeaceBeStill <small id="site"></small></h1>
    <p id="summary"></p>
    <p id="status" role="status" aria-live="polite"></p>
    <input id="filter" type="search" placeholder="Filter switches…" aria-label="Filter switches" autocomplete="off" />
    <button id="all-off" type="button">Turn all off</button>
    <form id="features"></form>
    <script src="settings.js"></script>
    <script src="core.js"></script>
    <script src="options.js"></script>
  </body>
</html>
