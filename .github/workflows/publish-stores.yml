name: publish-stores

# Publishes an existing release tag to the stores, by hand, from the Actions
# tab: the way back from a failed or rejected submission (fix the cause,
# dispatch the same tag), and the way a version reaches a store whose listing
# was created after it was tagged, without inventing a version nobody needed.
#
# AMO holds each version number once per add-on, so resubmitting a version that
# already went up fails. When only one extension needs to go out again, choose
# it, and the other is left alone. Either way each extension is its own job
# (submit.yml), so one failing does not stop the other.
#
# Like a release, only a tag on main can be published.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to publish, e.g. v1.0.0
        required: true
      extension:
        description: Which extension to publish
        type: choice
        options: [both, youtube, linkedin]
        default: both

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Typed by hand, so it reaches a shell only as a variable, and only once
      # it is known to be a version tag.
      - name: The tag must be a version tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$TAG is not a version tag of the form vX.Y.Z."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: The tag must be on main
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main. Only a release cut from main can be published."
            exit 1
          fi

      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint

      # Guards against dispatching a tag whose manifests say something else,
      # which would put the wrong version number on a store listing.
      - name: The tag must match every extension's manifest version
        env:
          TAG: ${{ inputs.tag }}
        run: node scripts/check-version.mjs "$TAG" extensions/youtube/src extensions/linkedin/src

  submit:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJSON(inputs.extension == 'both' && '["youtube", "linkedin"]' || format('["{0}"]', inputs.extension)) }}
    uses: ./.github/workflows/submit.yml
    with:
      extension: ${{ matrix.extension }}
      ref: ${{ inputs.tag }}
      require_amo: false
    secrets: inherit
