name: release

# Merging a version bump into main releases it. Once ci has built and passed a
# push to main, this asks scripts/autotag.mjs whether that commit's version has
# a tag yet: if it has, nothing happens. If not, the release is checked, the
# version is tagged on that commit, and every extension is published as a new
# version of its
# addons.mozilla.org listing, through Mozilla's API. Nothing is signed or hosted
# here: Mozilla signs each version and ships it to everyone who installed from
# AMO once review passes. The Chrome Web Store is published to as well once
# that store's credentials and listings exist.
#
# Tags are made here and nowhere else. A tag pushed by hand no longer releases
# anything; to publish a tagged version again, use publish-stores.yml. AMO is
# what a release is for, so a release with its credentials or either listing
# missing fails before tagging, rather than quietly skipping an extension.
#
# The tag goes on before anything is submitted, and creating it is the lock: a
# second run that reaches this point for the same version fails to create it
# and stops, so a version is never submitted twice. Each extension is then
# submitted by a job of its own (submit.yml), and one failing does not stop the
# other. The release page is only created once every submission has gone
# through, so it never claims a version went out that did not.
#
# Only the commit at the tip of main is released. A run for a commit that main
# has since moved past stands down: the newer commit's own run decides, once
# ci has passed it too.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One release run at a time, queued rather than cancelled: a run that starts
# while a release is going waits, then finds the tag and does nothing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    # ci passed, on a push to main -- not a pull request, whose branch this
    # would otherwise be told about too.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Is this commit main's tip, with a version not yet tagged?
        id: decide
        run: |
          if [ "$(git rev-parse origin/main)" != "$SHA" ]; then
            echo "main has moved past $SHA; the newer commit's run decides."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/autotag.mjs

  check:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ vars.AMO_JWT_ISSUER }}
      YOUTUBE_AMO_SLUG: ${{ vars.YOUTUBE_AMO_SLUG }}
      LINKEDIN_AMO_SLUG: ${{ vars.LINKEDIN_AMO_SLUG }}
    steps:
      # The API key is a pair. Its JWT issuer only names the key -- your
      # account's number and the key's -- and signs nothing on its own, so it is
      # a Variable, like the slugs. The JWT secret is the part that signs, and
      # is the one Secret. Saved in the wrong place, either reads as unset, so
      # the check says where it went rather than that it is missing.
      - name: addons.mozilla.org must be set up for both extensions
        env:
          HAS_AMO_SECRET: ${{ secrets.AMO_JWT_SECRET != '' }}
          AMO_SECRET_AS_VARIABLE: ${{ vars.AMO_JWT_SECRET != '' }}
          ISSUER_AS_SECRET: ${{ secrets.AMO_JWT_ISSUER != '' }}
          YOUTUBE_SLUG_AS_SECRET: ${{ secrets.YOUTUBE_AMO_SLUG != '' }}
          LINKEDIN_SLUG_AS_SECRET: ${{ secrets.LINKEDIN_AMO_SLUG != '' }}
        run: |
          missing=0
          miss() { echo "::error::$1"; missing=1; }
          key_page="https://addons.mozilla.org/developers/addon/api/key/"
          if [ "$HAS_AMO_SECRET" != "true" ]; then
            if [ "$AMO_SECRET_AS_VARIABLE" = "true" ]; then
              miss "AMO_JWT_SECRET is saved as a Variable. It signs releases, so it must be a Secret: add it under Settings > Secrets and variables > Actions > Secrets, delete the Variable, and generate a new key at $key_page if the Variable's value could have been seen."
            else
              miss "The AMO_JWT_SECRET secret is not set: add the JWT secret from $key_page under Settings > Secrets and variables > Actions > Secrets."
            fi
          fi
          for var in AMO_JWT_ISSUER YOUTUBE_AMO_SLUG LINKEDIN_AMO_SLUG; do
            case "$var" in
              AMO_JWT_ISSUER) as_secret=ISSUER_AS_SECRET; from=" (the JWT issuer from $key_page)" ;;
              *) as_secret="${var%%_AMO_SLUG}_SLUG_AS_SECRET"; from="" ;;
            esac
            if [ -z "${!var}" ]; then
              if [ "${!as_secret}" = "true" ]; then
                miss "$var is saved as a Secret. The workflow reads it as a Variable: add it under Settings > Secrets and variables > Actions > Variables."
              else
                miss "The $var variable is not set: add it$from under Settings > Secrets and variables > Actions > Variables."
              fi
            fi
          done
          exit $missing

      # ci has already installed, tested, linted and built this commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Every extension's manifest must carry the version being tagged
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: node scripts/check-version.mjs "$TAG" extensions/youtube/src extensions/linkedin/src

  # Through the API, with the workflow's own token: a tag made that way starts
  # no other workflow, so nothing else reacts to it. Fails if the tag exists.
  tag:
    needs: [version, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the commit being released
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" > /dev/null
          echo "Tagged $SHA as $TAG."

  submit:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        extension: [youtube, linkedin]
    uses: ./.github/workflows/submit.yml
    with:
      extension: ${{ matrix.extension }}
      ref: ${{ github.event.workflow_run.head_sha }}
      require_amo: true
    secrets: inherit

  release:
    needs: [version, submit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      YOUTUBE_AMO_SLUG: ${{ vars.YOUTUBE_AMO_SLUG }}
      LINKEDIN_AMO_SLUG: ${{ vars.LINKEDIN_AMO_SLUG }}
    steps:
      # No assets: the zips are unsigned, and a browser installs these from the
      # stores.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag \
            --notes "PeaceBeStill $TAG, submitted to addons.mozilla.org: https://addons.mozilla.org/firefox/addon/$YOUTUBE_AMO_SLUG/ and https://addons.mozilla.org/firefox/addon/$LINKEDIN_AMO_SLUG/ -- each version appears there once Mozilla's review passes."
