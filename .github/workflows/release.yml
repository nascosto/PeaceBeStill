name: release

# A v* tag on main publishes every extension as a new version of its
# addons.mozilla.org listing, through Mozilla's API. Nothing is signed or hosted
# here: Mozilla signs each version and ships it to everyone who installed from
# AMO once review passes. The Chrome Web Store is published to as well once
# that store's credentials and listings exist.
#
# Releases are cut from main and nowhere else, so a tag on any other commit
# fails before anything is built. AMO is what a release is for, so a tag with
# its credentials or either listing missing fails there too, rather than
# quietly skipping an extension.
#
# Each extension is submitted by a job of its own (submit.yml), and one failing
# does not stop the other. The release page is only created once every
# submission has gone through, so it never claims a version went out that did
# not.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ vars.AMO_JWT_ISSUER }}
      YOUTUBE_AMO_SLUG: ${{ vars.YOUTUBE_AMO_SLUG }}
      LINKEDIN_AMO_SLUG: ${{ vars.LINKEDIN_AMO_SLUG }}
    steps:
      # The API key is a pair. Its JWT issuer only names the key -- your
      # account's number and the key's -- and signs nothing on its own, so it is
      # a Variable, like the slugs. The JWT secret is the part that signs, and
      # is the one Secret. Saved in the wrong place, either reads as unset, so
      # the check says where it went rather than that it is missing.
      - name: addons.mozilla.org must be set up for both extensions
        env:
          HAS_AMO_SECRET: ${{ secrets.AMO_JWT_SECRET != '' }}
          AMO_SECRET_AS_VARIABLE: ${{ vars.AMO_JWT_SECRET != '' }}
          ISSUER_AS_SECRET: ${{ secrets.AMO_JWT_ISSUER != '' }}
          YOUTUBE_SLUG_AS_SECRET: ${{ secrets.YOUTUBE_AMO_SLUG != '' }}
          LINKEDIN_SLUG_AS_SECRET: ${{ secrets.LINKEDIN_AMO_SLUG != '' }}
        run: |
          missing=0
          miss() { echo "::error::$1"; missing=1; }
          key_page="https://addons.mozilla.org/developers/addon/api/key/"
          if [ "$HAS_AMO_SECRET" != "true" ]; then
            if [ "$AMO_SECRET_AS_VARIABLE" = "true" ]; then
              miss "AMO_JWT_SECRET is saved as a Variable. It signs releases, so it must be a Secret: add it under Settings > Secrets and variables > Actions > Secrets, delete the Variable, and generate a new key at $key_page if the Variable's value could have been seen."
            else
              miss "The AMO_JWT_SECRET secret is not set: add the JWT secret from $key_page under Settings > Secrets and variables > Actions > Secrets."
            fi
          fi
          for var in AMO_JWT_ISSUER YOUTUBE_AMO_SLUG LINKEDIN_AMO_SLUG; do
            case "$var" in
              AMO_JWT_ISSUER) as_secret=ISSUER_AS_SECRET; from=" (the JWT issuer from $key_page)" ;;
              *) as_secret="${var%%_AMO_SLUG}_SLUG_AS_SECRET"; from="" ;;
            esac
            if [ -z "${!var}" ]; then
              if [ "${!as_secret}" = "true" ]; then
                miss "$var is saved as a Secret. The workflow reads it as a Variable: add it under Settings > Secrets and variables > Actions > Variables."
              else
                miss "The $var variable is not set: add it$from under Settings > Secrets and variables > Actions > Variables."
              fi
            fi
          done
          exit $missing

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag must be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Releases are cut from main: merge the work into main, then tag main."
            exit 1
          fi

      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint

      - name: The tag must match every extension's manifest version
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME" extensions/youtube/src extensions/linkedin/src

  submit:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        extension: [youtube, linkedin]
    uses: ./.github/workflows/submit.yml
    with:
      extension: ${{ matrix.extension }}
      ref: ${{ github.sha }}
      require_amo: true
    secrets: inherit

  release:
    needs: submit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      YOUTUBE_AMO_SLUG: ${{ vars.YOUTUBE_AMO_SLUG }}
      LINKEDIN_AMO_SLUG: ${{ vars.LINKEDIN_AMO_SLUG }}
    steps:
      # No assets: the zips are unsigned, and a browser installs these from the
      # stores.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "PeaceBeStill $GITHUB_REF_NAME, submitted to addons.mozilla.org: https://addons.mozilla.org/firefox/addon/$YOUTUBE_AMO_SLUG/ and https://addons.mozilla.org/firefox/addon/$LINKEDIN_AMO_SLUG/ -- each version appears there once Mozilla's review passes."
