name: release

# A v* tag publishes every extension in the repo down four channels: the two
# stores, and the two self-hosted ones that system-setups installs from.
#
# The GitHub release is created before either store submission, so a rejected
# or queued review never costs us the self-hosted channel -- those assets are
# what the browser policies fetch, and they must land on the tag regardless.
#
# Store steps are skipped, not failed, when their credentials are absent, so
# the pipeline works from the first tag and starts publishing to each store as
# soon as that store's listing exists.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      YOUTUBE_AMO_SLUG: ${{ vars.YOUTUBE_AMO_SLUG }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      YOUTUBE_CWS_ITEM_ID: ${{ vars.YOUTUBE_CWS_ITEM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint

      - name: The tag must match every extension's manifest version
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME" extensions/youtube/src

      # The store package is the source tree; the self-hosted one is that tree
      # with the update_url keys and its own Firefox ID (scripts/variant.mjs).
      - name: Build both packages
        run: npm run build

      - name: Sign the self-hosted build (Mozilla's unlisted channel)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx web-ext sign --source-dir dist/self-hosted/youtube \
            --artifacts-dir dist --channel unlisted
          mv dist/*.xpi dist/peacebestill-youtube.xpi

      - name: Pack the CRX and write the update manifests
        env:
          YOUTUBE_CRX_PRIVATE_KEY: ${{ secrets.YOUTUBE_CRX_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$YOUTUBE_CRX_PRIVATE_KEY" > "$RUNNER_TEMP/youtube.pem"
          node scripts/pack-crx.mjs --key "$RUNNER_TEMP/youtube.pem" \
            --zip dist/peacebestill-youtube.zip --out dist/peacebestill-youtube.crx
          node scripts/update-manifests.mjs --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" \
            --key "$RUNNER_TEMP/youtube.pem" --src dist/self-hosted/youtube \
            --assets peacebestill-youtube --out dist
          rm -f "$RUNNER_TEMP/youtube.pem"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/peacebestill-youtube.xpi dist/peacebestill-youtube.crx \
            dist/peacebestill-youtube-updates.json dist/peacebestill-youtube-updates.xml \
            --title "$GITHUB_REF_NAME" \
            --notes "PeaceBeStill $GITHUB_REF_NAME. Also on addons.mozilla.org and the Chrome Web Store; the assets below are the self-hosted copies, which system-setups' browser policies fetch."

      # Listed on AMO, so the package must be the source tree: a listed add-on
      # may not carry an update_url, and Mozilla distributes and updates it.
      # Gated on the slug, not the credentials: those also sign the self-hosted
      # build, so their presence says nothing about whether a listing exists to
      # receive a version. Set the variable once the listing has been created.
      - name: Submit to addons.mozilla.org (listed)
        if: env.AMO_JWT_ISSUER != '' && env.YOUTUBE_AMO_SLUG != ''
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx web-ext sign --source-dir extensions/youtube/src \
            --artifacts-dir dist/amo --channel listed

      - name: Publish to the Chrome Web Store
        if: env.CWS_CLIENT_ID != '' && env.YOUTUBE_CWS_ITEM_ID != ''
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          node scripts/publish-cws.mjs --item "$YOUTUBE_CWS_ITEM_ID" \
            --zip dist/peacebestill-youtube-store.zip
